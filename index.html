<html>
  <head>
    <script src="face-api.js"></script>
    <script src="rem.js"></script>
    <script
      type="text/javascript"
      src="https://code.jquery.com/jquery-2.1.1.min.js"
    ></script>
  </head>
  <body>
    <script>
      const NUM_VIDEOS = 50;
      const AUDIO_START_BLINK = 8; // Start audio playback on this blink
      const AUDIO_JUMP_START_BLINK = 15; // Start random audio jumping on this blink

      let lastTimestamp = 0;
      let avgDelta = 1;
      let l_rat_window = [];
      let r_rat_window = [];
      let l_rat_ema = 0;
      let r_rat_ema = 0;
      let blinking = false;
      let bcounter = 0;
      let videoCache = [];
      let audioContext = null;
      let audioBuffer = null;
      let audioSource1 = null;
      let audioSource2 = null;
      let gainNode1 = null;
      let gainNode2 = null;
      let activeAudioIndex = 1; // Track which audio source is active (1 or 2)
      let activeVideoIndex = 1; // Track which video element is currently visible (1 or 2)
      let currentVideoIndex = 0; // Track which video content is playing (0-based: 0=001.mp4, 1=002.mp4, 2=003.mp4)
      let l_rat_history = []; // History of left eye aspect ratios for debug chart
      let r_rat_history = []; // History of right eye aspect ratios for debug chart

      async function run() {
        const loadStartTime = performance.now();
        const minLoadingTime = 12000; // Minimum 12 seconds

        await faceapi.loadTinyFaceDetectorModel("model");
        await faceapi.loadFaceLandmarkTinyModel("model");

        const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
        const camera = $("#inputVideo").get(0);
        camera.srcObject = stream;

        videoCache = precacheVideos(NUM_VIDEOS);
        const audioData = await loadAudio("001.mp3");
        audioContext = audioData.audioContext;
        audioBuffer = audioData.audioBuffer;

        // Initialize gain nodes for audio crossfading
        const gainNodes = initializeGainNodes(audioContext);
        gainNode1 = gainNodes.gainNode1;
        gainNode2 = gainNodes.gainNode2;

        // Calculate elapsed time and ensure minimum loading screen display
        const loadEndTime = performance.now();
        const elapsedTime = loadEndTime - loadStartTime;
        const remainingTime = Math.max(0, minLoadingTime - elapsedTime);

        // Wait for remaining time if needed
        await new Promise(resolve => setTimeout(resolve, remainingTime));

        // Hide loading text and show main content
        const loadingContainer = document.getElementById("loadingContainer");
        if (loadingContainer) {
          loadingContainer.style.display = "none";
        }

        // Show main content with first video
        const mainContent = document.getElementById("mainContent");
        if (mainContent) {
          mainContent.style.display = "flex";
        }

        // Start with the first video (001.mp4) visible, second video (002.mp4) preloaded
        currentVideoIndex = 0;
        const firstFilename =
          "vid/" + String(currentVideoIndex + 1).padStart(3, "0") + ".mp4";
        const secondFilename =
          "vid/" +
          String(((currentVideoIndex + 1) % NUM_VIDEOS) + 1).padStart(3, "0") +
          ".mp4";

        // Initialize video1 with first video (visible)
        const video1 = document.getElementById("blinkVideo1");
        if (video1) {
          video1.src = firstFilename;
          video1.load();
          video1.play();
        }

        // Preload video2 with second video (hidden, ready for first blink)
        const video2 = document.getElementById("blinkVideo2");
        if (video2) {
          video2.src = secondFilename;
          video2.load();
        }
      }

      async function detect() {
        const camera = $("#inputVideo").get(0);
        const leftEye = [36, 37, 38, 39, 40, 41];
        const rightEye = [42, 43, 44, 45, 46, 47];

        if (camera.paused || camera.ended) return setTimeout(() => detect());

        const detection = await faceapi
          .detectSingleFace(
            camera,
            new faceapi.TinyFaceDetectorOptions(512, 0.5)
          )
          .withFaceLandmarks(true);

        if (detection != null) {
          // Debug rendering
          const canvas = $("#overlay").get(0);
          faceapi.matchDimensions(canvas, camera, true);

          const left = getSubset(detection.landmarks.positions, leftEye);
          const right = getSubset(detection.landmarks.positions, rightEye);

          const l_rat = getRatio(left);
          const r_rat = getRatio(right);

          l_rat_window.unshift(l_rat);
          r_rat_window.unshift(r_rat);

          if (l_rat_window.length > 3) l_rat_window.pop();
          if (r_rat_window.length > 3) r_rat_window.pop();

          l_rat_ema += (l_rat - l_rat_ema) * 0.2;
          r_rat_ema += (r_rat - r_rat_ema) * 0.2;

          // Store ratio history for debug chart (keep last 100 values)
          l_rat_history.push(l_rat_ema / Math.min(...l_rat_window));
          r_rat_history.push(r_rat_ema / Math.min(...r_rat_window));
          if (l_rat_history.length > 100) l_rat_history.shift();
          if (r_rat_history.length > 100) r_rat_history.shift();

          // Debug: Draw eye landmark points and ratio chart
          //drawDebugLandmarks(canvas, left, right);
          //drawRatioChart(canvas, l_rat_history, r_rat_history);

          if (
            l_rat_ema > 1.05 * Math.min(...l_rat_window) &&
            r_rat_ema > 1.05 * Math.min(...r_rat_window)
          ) {
            if (blinking == false) {
              bcounter += 1;
              console.log(
                "blink " + bcounter,
                1000 / avgDelta,
                l_rat_ema,
                Math.min(...l_rat_window)
              );
              blinking = true;

              // Determine audio action based on blink count
              let audioAction = "none";
              if (bcounter === AUDIO_START_BLINK) {
                audioAction = "start";
                console.log("Blink " + bcounter + ": Starting audio playback");
              } else if (bcounter >= AUDIO_JUMP_START_BLINK) {
                audioAction = "jump";
              }

              const result = blink(
                bcounter,
                NUM_VIDEOS,
                audioBuffer,
                audioContext,
                audioSource1,
                audioSource2,
                gainNode1,
                gainNode2,
                activeAudioIndex,
                activeVideoIndex,
                audioAction,
                currentVideoIndex
              );

              audioSource1 = result.audioSource1;
              audioSource2 = result.audioSource2;
              activeAudioIndex = result.activeAudioIndex;
              activeVideoIndex = result.activeVideoIndex;
              currentVideoIndex = result.currentVideoIndex;
            }
          } else blinking = false;
        }

        const timeStats = updateTimeStats(
          lastTimestamp,
          avgDelta,
          performance.now()
        );
        lastTimestamp = timeStats.lastTimestamp;
        avgDelta = timeStats.avgDelta;

        setTimeout(() => detect());
      }

      $(document).ready(function () {
        run();
      });
    </script>

    <div
      id="videoContainer"
      style="position: absolute; top: 0; left: 0; opacity: 0; z-index: 10"
      class="margin"
    >
      <video
        onloadedmetadata="detect(this)"
        id="inputVideo"
        autoplay
        muted
        playsinline
      ></video>
    </div>
    <div
      id="mainContent"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: none;
        background: black;
        align-items: center;
        justify-content: center;
      "
    >
      <video
        id="blinkVideo1"
        loop
        muted
        playsinline
        style="position: absolute; z-index: 2; opacity: 1"
      ></video>
      <video
        id="blinkVideo2"
        loop
        muted
        playsinline
        style="position: absolute; z-index: 1; opacity: 0"
      ></video>
      <canvas
        id="overlay"
        style="position: absolute; top: 0; left: 0; z-index: 10"
      />
    </div>
    <div
      id="loadingContainer"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        color: white;
        font-family: monospace;
        font-size: 24px;
      "
    >
      For a better experience we suggest you to turn on the lights,<br />
      Check your loudspeakers,<br />
      Seat straight in front of your screen so the camera can observe you
      clearly,<br />
      And enjoy the generative experience you are about to watch<br />
      <br />
      Loading...
    </div>
  </body>
</html>
